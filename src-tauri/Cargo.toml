[package]
name = "vibeassist-desktop"
version = "0.1.0"
description = "VibeAssist native Rust desktop studio (Tauri v2)"
authors = ["VibeAssist"]
edition = "2021"

[lib]
name = "vibeassist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
