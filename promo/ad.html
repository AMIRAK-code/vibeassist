<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeAssist Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
:root{
  --pink:#ff2e93; --cyan:#00f0ff; --cyanD:#00b0d0; --bone:#FAF9F6; --ink:#111111; --ink2:#555566;
  --grad:linear-gradient(135deg in oklch,#ff2e93,#00b0d0);
  --gradN:linear-gradient(135deg in oklch,#ff2e93,#00f0ff);
  --gradH:linear-gradient(90deg in oklch,#ff2e93,#00b0d0);
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bone);font-family:'Outfit',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;flex:none;transform-origin:50% 50%}
:where(#stage *){box-sizing:border-box;margin:0;padding:0}
.layer{position:absolute;inset:0;pointer-events:none}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.mono{font-family:'JetBrains Mono',monospace}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.gtn{background:var(--gradN);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ln{display:block;overflow:hidden;padding:0 .06em .14em;margin:0 -.06em -.14em}
.li{display:inline-block;transform-origin:0 100%;will-change:transform}
.ico{display:inline-block;vertical-align:middle;flex:none}

/* ---------- backgrounds ---------- */
.blob{position:absolute;border-radius:50%;width:1400px;height:1400px}
.b1{left:-420px;top:-420px;background:radial-gradient(closest-side,rgba(255,46,147,.22),rgba(255,46,147,0))}
.b2{left:1000px;top:40px;background:radial-gradient(closest-side,rgba(0,176,208,.22),rgba(0,176,208,0))}
.b3{left:420px;top:560px;background:radial-gradient(closest-side,rgba(140,92,255,.13),rgba(140,92,255,0))}
.dots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(17,17,17,.11) 1.3px,transparent 1.7px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 10%,transparent 80%)}
#bgDark{background:radial-gradient(ellipse at 50% 45%,#11111e 0%,#07070d 55%,#030305 100%)}
.d1{left:-400px;top:-500px;background:radial-gradient(closest-side,rgba(255,46,147,.17),transparent)}
.d2{left:900px;top:300px;background:radial-gradient(closest-side,rgba(0,240,255,.12),transparent)}
.dgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 20%,transparent 80%)}

/* ---------- shared UI atoms ---------- */
.kicker{display:inline-flex;align-items:center;gap:14px;font:500 19px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:8px 18px 8px 8px;border:1px solid rgba(0,0,0,.08);border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 8px 24px -12px rgba(40,20,90,.2)}
.kicker b{display:inline-grid;place-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.02em}
.kicker.dk{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.72);box-shadow:none}
.kicker .prem{margin-left:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,46,147,.6);color:#ff6fb3;letter-spacing:.12em;font-size:14px}
.hl{font-weight:700;font-size:90px;line-height:.98;letter-spacing:-.04em;margin-top:28px}
.hl.c{text-align:center}
.sub{font-size:28px;line-height:1.4;color:var(--ink2);margin-top:28px;font-weight:400}
.copy{position:absolute;left:120px;width:800px}
.glass{background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.07);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 40px 90px -30px rgba(50,20,100,.28),0 10px 30px -12px rgba(50,20,100,.14)}
.tile{position:relative;display:grid;place-items:center;background:var(--grad);overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 30px 60px -18px rgba(255,46,147,.45),0 22px 50px -24px rgba(0,176,208,.6)}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%);pointer-events:none}
.tile svg{position:relative;z-index:2;width:60%;height:60%}
.sheen{position:absolute;top:-30%;left:0;width:34%;height:160%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));transform:translateX(-200%) skewX(-20deg);z-index:3}

/* ---------- lockup ---------- */
.lock{position:absolute;left:0;top:0;display:flex;align-items:center;gap:44px}
.lock .tile{width:180px;height:180px;border-radius:48px;z-index:2}
.word{position:relative;font-weight:700;font-size:172px;letter-spacing:-.05em;line-height:1;display:flex;overflow:hidden;padding:.02em .04em .16em;margin-bottom:-.16em}
.word .ch{display:inline-block;white-space:pre}

/* ---------- S1 hook ---------- */
#s1{background:transparent;color:#fff}
.s1wrap{position:absolute;inset:0}
.s1term{position:absolute;left:470px;top:452px;font:500 46px/1.55 'JetBrains Mono',monospace;color:#ececf4;white-space:pre}
.s1term .pr{color:#ff2e93}.s1term .dir{color:#00f0ff}
.caret{display:inline-block;width:.56em;height:1.02em;background:#ececf4;vertical-align:-.17em;margin-left:2px}
.s1term .out{font-size:30px;color:#3ddc84;opacity:0}
.s1term .out .dim{color:rgba(255,255,255,.45)}
.s1ship{position:absolute;left:0;right:0;top:350px;text-align:center;font-weight:800;font-size:260px;line-height:1;letter-spacing:-.055em;color:#fff;opacity:0}
.s1ship i{display:block;margin:26px auto 0;width:760px;height:16px;border-radius:8px;background:var(--gradN);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 40px rgba(255,46,147,.5)}
.s1warn{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,30,80,0) 42%,rgba(255,30,80,.30) 100%);opacity:0}
.cc{position:absolute;left:0;top:0;width:380px;display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;background:rgba(22,22,34,.94);border:1px solid rgba(255,255,255,.11);box-shadow:0 26px 50px -12px rgba(0,0,0,.7);color:#fff;opacity:0}
.cc .bd{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:800 24px 'Outfit';color:#fff}
.cc .tt{font-size:19px;font-weight:600;white-space:nowrap}
.cc .ss{font:500 15px 'JetBrains Mono',monospace;color:rgba(255,255,255,.62);margin-top:3px;white-space:nowrap}
.s1dim{position:absolute;inset:0;background:radial-gradient(ellipse 55% 42% at 50% 50%,rgba(3,3,6,.92),rgba(3,3,6,0));opacity:0}
.s1now{position:absolute;left:0;right:0;top:400px;height:280px;opacity:0}
.s1now .gl{position:absolute;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:240px;line-height:1;letter-spacing:-.055em;white-space:nowrap}
.s1now .gl span{display:inline-block}
.s1now .r{color:#ff2e93;mix-blend-mode:screen}
.s1now .c{color:#00f0ff;mix-blend-mode:screen}
.s1now .b{color:#fff}

/* ---------- S2 logo ---------- */
.tag{position:absolute;left:0;right:0;top:600px;text-align:center;font-weight:700;font-size:88px;line-height:1.02;letter-spacing:-.04em}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);font-size:22px;font-weight:500;color:var(--ink2);box-shadow:0 10px 30px -14px rgba(40,20,90,.25)}
.s2chip{position:absolute;left:0;right:0;top:850px;text-align:center}

/* ---------- S3 HUD ---------- */
.persp{position:absolute;inset:0;perspective:2300px;perspective-origin:1250px 540px}
.win{position:absolute;left:730px;top:175px;width:1140px;height:740px;border-radius:22px;background:#FAF9F6;border:1px solid rgba(0,0,0,.09);box-shadow:0 70px 130px -30px rgba(50,20,100,.40),0 24px 50px -24px rgba(50,20,100,.3);transform-origin:30% 50%;transform-style:preserve-3d}
.wbar{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;background:rgba(0,0,0,.03);border-bottom:1px solid rgba(0,0,0,.06);border-radius:22px 22px 0 0}
.wbar i{width:12px;height:12px;border-radius:50%;background:#ff5f56}.wbar i:nth-child(2){background:#ffbd2e}.wbar i:nth-child(3){background:#27c93f}
.wbar span{margin-left:14px;font:500 14px 'JetBrains Mono',monospace;color:#8a8a99}
.wbody{display:flex;height:calc(100% - 44px);overflow:hidden;border-radius:0 0 22px 22px}
.side{width:236px;padding:22px 14px;border-right:1px solid rgba(0,0,0,.06);background:rgba(250,249,246,.95);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;margin:0 0 16px 8px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#555566;font-size:14.5px;white-space:nowrap}
.nav.on{background:rgba(0,0,0,.05);color:#111;box-shadow:inset 3px 0 0 #00b0d0}
.nav .lk{margin-left:auto;opacity:.55}
.sep{height:1px;background:rgba(0,0,0,.08);margin:6px 0}
.prem{margin-top:auto;border:1px solid #ff2e93;border-radius:14px;padding:14px;text-align:center;font-size:14px;background:rgba(255,255,255,.8)}
.prem b{display:block;font-size:15px;margin:6px 0 2px;color:#111}
.prem span{color:#555566;font-size:12px}
.mainc{flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hudh{display:flex;justify-content:space-between;align-items:flex-start}
.hudh h3{font-size:30px;font-weight:600;letter-spacing:-.02em}
.hudh p{font-size:14px;color:#555566;margin-top:4px}
.btnp{background:var(--grad);color:#fff;border-radius:12px;padding:11px 18px;font-weight:500;font-size:14px;box-shadow:0 4px 15px rgba(255,46,147,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.07);border-radius:16px;padding:15px 16px}
.stat .t{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#555566}
.stat .v{font-size:31px;font-weight:600;margin-top:10px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;margin-top:6px;color:#00a3c4}
.stat .d.neg{color:#ff2e93}
.chartc{flex:1;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.07);border-radius:16px;padding:16px 18px;position:relative}
.chartc h4{font-size:17px;font-weight:600;display:flex;align-items:center;gap:18px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#555566;font-weight:500}
.lg i{width:10px;height:10px;border-radius:3px}
.chartc svg{position:absolute;left:12px;right:12px;bottom:10px;width:calc(100% - 24px);height:350px;overflow:visible}
.callout{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;font-weight:600;font-size:22px;white-space:nowrap;opacity:0}
.callout.g{background:var(--grad);color:#fff;box-shadow:0 26px 50px -16px rgba(255,46,147,.55)}
.callout.w{background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 26px 50px -18px rgba(50,20,100,.35)}

/* ---------- S4 integrations ---------- */
.s4head{position:absolute;left:0;right:0;top:66px;text-align:center}
.s4svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.hub{position:absolute;left:960px;top:676px;width:176px;height:176px;border-radius:48px;transform:translate(-50%,-50%)}
.icard{position:absolute;width:420px;height:136px;display:flex;align-items:center;gap:18px;padding:0 24px;opacity:0}
.icard .ii{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none}
.icard h5{font-size:24px;font-weight:600;letter-spacing:-.01em}
.icard p{font:500 14px 'JetBrains Mono',monospace;color:#777788;margin-top:5px}
.icard .stt{position:absolute;right:18px;top:-16px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:600 13px 'JetBrains Mono',monospace;background:#fff;border:1px solid rgba(0,0,0,.1);color:#8a8a99;box-shadow:0 8px 20px -10px rgba(0,0,0,.25)}
.icard .stt.on{background:#e9fbf2;border-color:#9fe5c3;color:#12975c}
.hubcount{position:absolute;left:0;right:0;top:810px;text-align:center;opacity:0}
.pkt{position:absolute;left:0;top:0;padding:5px 10px;border-radius:999px;background:#111;color:#fff;font:600 13px 'JetBrains Mono',monospace;white-space:nowrap;opacity:0}

/* ---------- S5 AI ---------- */
.chat{position:absolute;left:110px;top:150px;width:960px;height:790px;opacity:0}
.chd{display:flex;align-items:center;gap:16px;padding:24px 28px;border-bottom:1px solid rgba(0,0,0,.06)}
.chd .ti{width:56px;height:56px;border-radius:16px}
.chd h4{font-size:26px;font-weight:600}
.chd .on{font:500 15px 'JetBrains Mono',monospace;color:#16a86a;display:flex;align-items:center;gap:8px;margin-top:3px}
.chd .on i{width:9px;height:9px;border-radius:50%;background:#22c77a;box-shadow:0 0 0 4px rgba(34,199,122,.18)}
.mods{margin-left:auto;display:flex;gap:8px}
.mod{font:500 13px 'JetBrains Mono',monospace;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.04);color:#555566;display:flex;gap:7px;align-items:center;white-space:nowrap}
.msg{position:absolute;left:28px;max-width:740px;padding:18px 22px;border-radius:20px;font-size:23px;line-height:1.42;opacity:0}
.msg.sys{background:rgba(0,0,0,.045);color:#222;border-top-left-radius:6px}
.msg.usr{left:auto;right:28px;background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:0 18px 40px -18px rgba(255,46,147,.6)}
.msg.ai{background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 18px 44px -20px rgba(60,20,120,.3);width:830px;max-width:none;border-top-left-radius:6px}
.ai .lead{font-size:21px;color:#555566}
.ai .row{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:24px;opacity:0}
.ai .row .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(0,176,208,.10);flex:none}
.ai .row .pl{margin-left:auto;padding:6px 14px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:22px}
.typing{position:absolute;left:28px;top:430px;padding:20px 22px;border-radius:20px;background:rgba(0,0,0,.045);display:flex;gap:8px;opacity:0}
.typing i{width:12px;height:12px;border-radius:50%;background:#9a9aaa}
.inp{position:absolute;left:28px;right:28px;bottom:26px;height:76px;border-radius:18px;border:1px solid rgba(0,0,0,.1);background:#fff;display:flex;align-items:center;padding:0 12px 0 24px;font-size:22px;color:#111}
.inp .ph{color:#9a9aaa}
.inp .ic{width:2px;height:28px;background:#00b0d0;margin-left:2px}
.snd{margin-left:auto;width:54px;height:54px;border-radius:15px;background:var(--grad);display:grid;place-items:center}
.bigm{position:absolute;left:1160px;top:650px;width:640px;height:250px;padding:30px 34px;opacity:0;transform-origin:0 0}
.bigm .n{font-size:150px;font-weight:800;letter-spacing:-.06em;line-height:.9}
.bigm .l{font:500 18px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:#555566;margin-top:10px}
.bigm svg{position:absolute;right:34px;bottom:34px;width:250px;height:150px;overflow:visible}

/* ---------- S6 ads ---------- */
.kpi{position:absolute;left:1120px;top:108px;width:700px;height:252px;display:flex;align-items:center;gap:30px;padding:0 34px;opacity:0}
.gauge{position:relative;width:196px;height:196px;flex:none}
.gauge svg{width:100%;height:100%;overflow:visible}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .gv b{font-size:46px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}
.gauge .gv span{font:500 13px 'JetBrains Mono',monospace;color:#777788;letter-spacing:.12em;margin-top:6px;display:block}
.kv{display:flex;flex-direction:column;gap:22px}
.kv small{display:block;font:500 14px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:#777788}
.kv b{display:block;font-size:44px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kv em{font-style:normal;font-size:17px;color:#ff2e93;font-weight:500;margin-left:10px;letter-spacing:0}
.tiles{position:absolute;left:84px;top:430px;width:1752px;height:500px}
.tl{position:absolute;top:0;width:272px;height:500px;padding:22px;display:flex;flex-direction:column;opacity:0}
.tl .bdg{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:23px;color:#fff;letter-spacing:-.02em}
.tl .nm{font-size:23px;font-weight:600;margin-top:18px;line-height:1.12;height:52px;letter-spacing:-.01em}
.tl .st{font:600 13px 'JetBrains Mono',monospace;margin-top:10px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:uppercase}
.tl .st i{width:8px;height:8px;border-radius:50%}
.tl .bars{margin-top:auto;height:150px;display:flex;align-items:flex-end;gap:8px}
.tl .bars i{flex:1;height:100%;border-radius:6px 6px 3px 3px;transform-origin:50% 100%;transform:scaleY(0)}
.tl .sp{margin-top:18px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tl .sp small{display:block;font:500 13px 'JetBrains Mono',monospace;color:#777788;margin-bottom:4px;text-transform:uppercase;letter-spacing:.1em}
.tl .ring{position:absolute;inset:-3px;border-radius:26px;border:3px solid transparent;background:var(--gradN) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0}
.toast{position:absolute;right:84px;top:958px;text-align:right;opacity:0}
.toast span{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;background:#0e0e16;color:#fff;font-size:21px;font-weight:500;box-shadow:0 20px 40px -16px rgba(0,0,0,.5)}
.toast em{font-style:normal;color:#00f0ff;font-weight:600}

/* ---------- S7 legal ---------- */
.docs{position:absolute;inset:0;perspective:1800px;perspective-origin:1330px 540px}
.doc{position:absolute;width:380px;height:500px;background:#fff;border-radius:20px;border:1px solid rgba(0,0,0,.08);box-shadow:0 50px 90px -34px rgba(40,20,90,.40),0 12px 30px -14px rgba(40,20,90,.18);padding:28px;opacity:0}
.dh{display:flex;align-items:center;gap:12px}
.di{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(255,46,147,.08);flex:none}
.doc h5{font-size:24px;font-weight:700;letter-spacing:-.01em}
.doc .meta{font:500 12.5px 'JetBrains Mono',monospace;color:#8a8a99;margin-top:3px}
.lns{margin-top:28px;display:flex;flex-direction:column;gap:17px}
.lns i{display:block;height:10px;border-radius:5px;background:rgba(17,17,17,.06);position:relative;overflow:hidden}
.lns i.h{height:14px;margin-top:6px}
.lns i b{position:absolute;inset:0;border-radius:5px;background:rgba(17,17,17,.2);transform-origin:0 50%;transform:scaleX(0)}
.lns i.h b{background:var(--gradH);opacity:.8}
.sig{position:absolute;left:28px;right:28px;bottom:28px;display:flex;justify-content:space-between;align-items:center;font:500 13px 'JetBrains Mono',monospace;color:#8a8a99;border-top:1px dashed rgba(0,0,0,.14);padding-top:14px}
.stamp{position:absolute;left:1128px;top:600px;display:flex;align-items:center;gap:14px;padding:14px 26px;border:5px solid #ff2e93;border-radius:18px;font:800 46px 'Outfit';letter-spacing:.06em;color:#ff2e93;background:rgba(255,255,255,.72);opacity:0;box-shadow:0 20px 50px -20px rgba(255,46,147,.6)}

S11.init = () => {
  S11.L = initLock('s11', 272);
  const c = $('#s11cta'); S11.cw = c.offsetWidth; c.style.marginLeft = (-S11.cw / 2) + 'px';
};
S11.update = t => {
  S11.el.style.opacity = t < 28.0 ? 0 : 1;
  animLock(S11.L, t, 28.0, .85);
  lines($('#s11tag'), t, 28.4, .16);
  const cta = $('#s11cta'), cp = P(t, 28.62, 29.12), click = P(t, 29.18, 29.34);
  cta.style.opacity = P(t, 28.62, 28.7);
  cta.style.transform = `translateY(${(1 - E.outX(cp)) * 40}px) scale(${(cp <= 0 ? .6 : lerp(.6, 1, E.outBs(cp))) * (1 - .06 * Math.sin(Math.PI * click))})`;
  sheen($('#s11sh'), t, 29.3, .8);
  fadeUp($('#s11chip'), t, 28.85, .6, 20);
  const cur = $('#s11cur'), mp = E.ioC(P(t, 28.72, 29.16));
  const bx = 960 + 120, by = 812;
  cur.style.opacity = P(t, 28.72, 28.85);
  cur.style.transform = `translate(${lerp(1560, bx, mp)}px,${lerp(1100, by, mp)}px) scale(${1 - .15 * Math.sin(Math.PI * click)})`;
  const rp = P(t, 29.2, 29.75), rip = $('#s11rp');
  rip.style.opacity = rp > 0 && rp < 1 ? (1 - rp) : 0;
  rip.style.transform = `translate(${bx - 20}px,${by - 20}px) scale(${1 + E.outC(rp) * 9})`;
};
S11.fx = (t, ctx) => {
  if (t >= 27.35 && t < 28.05) {
    const r = rng(8), q0 = P(t, 27.35, 28.0);
    for (let i = 0; i < 120; i++) {
      const a0 = r() * 6.283, R0 = 500 + r() * 800, d = r() * .25;
      const q = E.inC(P(t, 27.35 + d, 28.0)); if (q <= 0) continue;
      const rad = R0 * (1 - q), ang = a0 + q * 2.4, rad2 = R0 * (1 - Math.max(0, q - .06)), ang2 = a0 + Math.max(0, q - .06) * 2.4;
      ctx.strokeStyle = i % 3 ? '#ff2e93' : '#00c8e6'; ctx.globalAlpha = .9 * q; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(960 + Math.cos(ang2) * rad2, 540 + Math.sin(ang2) * rad2); ctx.lineTo(960 + Math.cos(ang) * rad, 540 + Math.sin(ang) * rad); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(960, 540, 0, 960, 540, 60 + q0 * 260);
    g.addColorStop(0, `rgba(255,255,255,${.9 * q0})`); g.addColorStop(.4, `rgba(255,46,147,${.35 * q0})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  burstFX(ctx, t, 28.0, 960, 440, 150, 31, { vmin: 500, vmax: 2200, drag: 3.4, life: 1.4, smin: 2, smax: 6 });
  ringFX(ctx, t, 28.0, 960, 440, 60, 1300, .9, 14);
  ringFX(ctx, t, 28.08, 960, 440, 40, 900, .8, 6);
  burstFX(ctx, t, 29.2, 1080, 812, 36, 44, { vmin: 200, vmax: 800, drag: 5, life: .6, smin: 2, smax: 4 });
};

/* ---------------- shared FX ---------------- */
const COLS = ['#ff2e93', '#00c8e6', '#9a5cf5', '#ff7ac0', '#ffffff'];
function burstFX(ctx, t, t0, x0, y0, n, seed, o) {
  const age = t - t0; if (age < 0 || age > o.life * 1.3) return;
  const r = rng(seed), cols = o.cols || COLS;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = r() * 6.283, v = o.vmin + r() * (o.vmax - o.vmin), life = o.life * (.45 + r() * .8), sz = o.smin + r() * (o.smax - o.smin), col = cols[Math.floor(r() * cols.length)];
    if (age > life) continue;
    const k = o.drag, d = v * (1 - Math.exp(-k * age)) / k, d2 = v * (1 - Math.exp(-k * Math.max(0, age - .04))) / k;
    ctx.globalAlpha = Math.pow(1 - age / life, 1.3);
    ctx.strokeStyle = col; ctx.lineWidth = sz;
    ctx.beginPath(); ctx.moveTo(x0 + Math.cos(a) * d2, y0 + Math.sin(a) * d2); ctx.lineTo(x0 + Math.cos(a) * d + .1, y0 + Math.sin(a) * d); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function ringFX(ctx, t, t0, x, y, r0, r1, dur, w) {
  const p = P(t, t0, t0 + dur); if (p <= 0 || p >= 1) return;
  const r = lerp(r0, r1, E.outX(p));
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r); g.addColorStop(0, '#ff2e93'); g.addColorStop(.5, '#9a5cf5'); g.addColorStop(1, '#00e0ff');
  ctx.globalAlpha = 1 - p; ctx.lineWidth = w * (1 - p) + 1; ctx.strokeStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
}

/* ---------------- rail (persistent progress HUD) ---------------- */
const RAIL = [[6.5, 9.5, 'Overall Income'], [9.5, 12, 'Integrations'], [12, 15.5, 'AI Business Analyzer'], [15.5, 18, 'Ad Manager'], [18, 20.5, 'Publishing & Legal'], [20.5, 22, 'News & Newsletter'], [22, 25, 'Anti-Fragile Engine']];
$('#rail').innerHTML = `<div class="tile rt">${markSVG(3)}</div><span class="rn">VibeAssist</span><div class="segs">${RAIL.map(() => '<i><b></b></i>').join('')}</div><span class="num"><b id="rN">01</b> / 07</span><span class="lab" id="rL"></span>`;
function updateRail(t) {
  const rail = $('#rail');
  rail.style.opacity = P(t, 6.7, 7.0) * (1 - P(t, 24.8, 25.0));
  rail.classList.toggle('dk', t >= 22 && t < 25.1);
  let cur = 0; RAIL.forEach((r, i) => { if (t >= r[0]) cur = i; });
  $$('#rail .segs b').forEach((b, i) => { b.style.transform = `scaleX(${i < cur ? 1 : i > cur ? 0 : P(t, RAIL[i][0], RAIL[i][1])})`; });
  $('#rN').textContent = String(cur + 1).padStart(2, '0'); $('#rL').textContent = RAIL[cur][2];
}

/* ---------------- global overlays ---------------- */
const fxB = $('#fxBack').getContext('2d'), fxF = $('#fxFront').getContext('2d');
function overlays(t) {
  const dark = (t < 4.0) || (t >= 22.0 && t < 25.05);
  $('#bgDark').style.opacity = dark ? 1 : 0; $('#bgLight').style.opacity = dark ? 0 : 1;
  $$('#bgLight .blob').forEach((b, i) => { const ph = i * 2.1; b.style.transform = `translate3d(${Math.sin(t * .33 + ph) * 140}px,${Math.cos(t * .27 + ph) * 100}px,0) scale(${1 + .1 * Math.sin(t * .5 + ph) + .04 * beat(t)})`; });
  $$('#bgDark .blob').forEach((b, i) => { const ph = i * 1.7; b.style.transform = `translate3d(${Math.sin(t * .4 + ph) * 120}px,${Math.cos(t * .3 + ph) * 90}px,0)`; });
  $('#bgLight .dots').style.transform = `translate3d(${(t * 6) % 34}px,${(t * 4) % 34}px,0)`;
  // iris reveal at the drop
  const iris = $('#iris');
  if (t >= 4.0 && t < 4.75) {
    const R = lerp(0, 1200, E.outX(P(t, 4.0, 4.7)));
    iris.style.display = 'block';
    iris.style.webkitMaskImage = iris.style.maskImage = `radial-gradient(circle at 960px 540px, transparent ${R}px, #000 ${R + 1.5}px)`;
  } else iris.style.display = 'none';
  // bloom out of the shield
  const bloom = $('#bloom');
  if (t >= 24.85 && t < 25.5) {
    const R = lerp(0, 2300, E.inC(P(t, 24.85, 25.1)));
    bloom.style.display = 'block';
    bloom.style.clipPath = `circle(${R}px at ${SC[0]}px ${SC[1]}px)`;
    bloom.style.opacity = 1 - P(t, 25.12, 25.5);
  } else bloom.style.display = 'none';
  // gradient wipe
  const wipe = $('#wipe');
  if (t >= 17.68 && t < 18.24) {
    wipe.style.display = 'block';
    wipe.style.transform = `translateX(${lerp(-3400, 2300, E.ioC(P(t, 17.68, 18.22)))}px) skewX(-18deg)`;
  } else wipe.style.display = 'none';
  // flashes
  let fl = 0;
  if (t >= 4.0) fl = Math.max(fl, 1 - E.outC(P(t, 4.0, 4.45)));
  if (t >= 28.0) fl = Math.max(fl, .75 * (1 - E.outC(P(t, 28.0, 28.4))));
  $('#flash').style.opacity = fl;
  // grain
  const g = $('#grain'), gr = rng(Math.floor(t * 24) + 1);
  g.style.backgroundPosition = `${Math.floor(gr() * 256)}px ${Math.floor(gr() * 256)}px`;
  g.classList.toggle('dk', dark);
  $('#vig').style.opacity = dark ? 2.2 : 1;
}
function glitchFX(t, ctx) {
  const g = Math.max(Math.sin(Math.PI * P(t, 21.82, 22.2)), 0);
  if (g <= 0) return;
  const r = rng(Math.floor(t * 60) + 77);
  for (let i = 0; i < 18; i++) {
    const y = r() * H, h = 2 + r() * 46, x = (r() - .5) * 300 * g, w = W * (.3 + r() * .9);
    ctx.globalAlpha = (.35 + r() * .6) * g;
    ctx.fillStyle = ['#ff2e93', '#00f0ff', '#ffffff', '#111111'][Math.floor(r() * 4)];
    ctx.fillRect(x + r() * W * .4, y, w, h);
  }
  ctx.globalAlpha = .25 * g; ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
}
function irisRing(t, ctx) {
  if (t < 4.0 || t > 4.9) return;
  ringFX(ctx, t, 4.0, 960, 540, 0, 1200, .75, 16);
  ringFX(ctx, t, 4.07, 960, 540, 0, 900, .75, 6);
}

/* ---------------- main render ---------------- */
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  overlays(t);
  for (const s of SCENES) {
    const vis = t >= s.a && t < s.b;
    if (vis !== s._vis) { s.el.style.display = vis ? 'block' : 'none'; s._vis = vis; }
    if (vis && s.update) s.update(t);
  }
  updateRail(t);
  fxB.clearRect(0, 0, W, H); fxF.clearRect(0, 0, W, H);
  for (const s of SCENES) if (s.fx && t >= s.a - .1 && t < s.b + .5) { s.fx(t, fxB, true); s.fx(t, fxF, false); }
  irisRing(t, fxF); glitchFX(t, fxF);
}
// keep fx signatures uniform: scenes that only draw front-layer effects ignore the back pass
[S1, S2, S6, S7, S10, S11].forEach(s => { const f = s.fx; s.fx = (t, ctx, back) => { if (!back) f(t, ctx); }; });

/* ---------------- boot ---------------- */
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), d = x.createImageData(256, 256), r = rng(42);
  for (let i = 0; i < d.data.length; i += 4) { const v = 120 + r() * 135; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
}
window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all(['400 20px Outfit', '600 20px Outfit', '700 20px Outfit', '800 20px Outfit', '900 20px Outfit', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  makeGrain();
  SCENES.forEach(s => { s.el.style.display = 'block'; });
  SCENES.forEach(s => s.init && s.init());
  SCENES.forEach(s => { s.el.style.display = 'none'; s._vis = false; });
  renderAt(0);
  return true;
})();
window.renderAt = renderAt;

/* ---------------- preview player ---------------- */
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
function fit() { const s = RENDER ? 1 : Math.min(innerWidth / W, innerHeight / H); $('#stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
if (!RENDER) {
  const aud = $('#aud'), pp = $('#pp'), sc = $('#scrub'), tc = $('#tc');
  let playing = false, clock0 = 0, tBase = 0, cur = 0, audOK = false;
  aud.addEventListener('canplaythrough', () => { audOK = true; });
  aud.addEventListener('error', () => { audOK = false; });
  const setBtn = () => { pp.textContent = playing ? '❚❚' : '▶'; };
  function play() { if (cur >= DURATION - .01) cur = 0; playing = true; tBase = cur; clock0 = performance.now(); if (audOK) { aud.currentTime = cur; aud.play().catch(() => { }); } setBtn(); }
  function pause() { playing = false; aud.pause(); setBtn(); }
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { cur = +sc.value; if (playing) { tBase = cur; clock0 = performance.now(); if (audOK) aud.currentTime = cur; } };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } if (e.code === 'ArrowRight') { cur = Math.min(DURATION, cur + .5); sc.oninput && (sc.value = cur); } if (e.code === 'ArrowLeft') { cur = Math.max(0, cur - .5); sc.value = cur; } });
  window.__ready.then(() => {
    (function loop() {
      if (playing) { cur = (audOK && !aud.paused) ? aud.currentTime : tBase + (performance.now() - clock0) / 1000; if (cur >= DURATION) { cur = DURATION; pause(); } sc.value = cur; }
      renderAt(cur); tc.textContent = `${cur.toFixed(2).padStart(5, '0')} / 30.00`;
      requestAnimationFrame(loop);
    })();
    setTimeout(play, 400);
  });
}
</script>
